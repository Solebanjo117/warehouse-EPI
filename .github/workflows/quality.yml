name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: warehouse_epi_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      WAREHOUSE_EPI_TEST_CONNECTION: Host=localhost;Port=5432;Database=warehouse_epi_test;Username=postgres;Password=warehouse_epi_ci
      ConnectionStrings__Warehouse: Host=localhost;Port=5432;Database=warehouse_epi_test;Username=postgres;Password=warehouse_epi_ci
      Security__PinLookupKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Ejecutar Quality
        shell: pwsh
        run: ./scripts/quality.ps1

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_number }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
            artifacts/migrations.sql
          if-no-files-found: error
          retention-days: 14
